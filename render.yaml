services:
  - type: web
    name: avicola-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "24h"
      - key: CORS_ORIGIN
        sync: false
      - key: PORT
        value: "3001"
      - key: NODE_ENV
        value: "production"
