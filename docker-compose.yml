version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: avicola_db
    restart: always
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: avicola
      POSTGRES_PASSWORD: avicola_secret_2026
      POSTGRES_DB: avicola_produccion
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U avicola']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: avicola_minio
    restart: always
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: avicola_minio
      MINIO_ROOT_PASSWORD: avicola_minio_secret_2026
    command: server /data --console-address ':9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  postgres_data:
  minio_data:
